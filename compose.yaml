name: simmer

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: simmer
      POSTGRES_USER: simmer
      POSTGRES_PASSWORD: simmer_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simmer -d simmer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: